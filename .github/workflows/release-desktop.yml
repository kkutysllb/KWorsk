name: Release

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
    tags:
      - "v*"

# 创建 GitHub Release 需要 contents: write（GITHUB_TOKEN 默认只读）
permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # qilin 是 QiLin 引擎 submodule，必须递归检出
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          # The repo root has no package.json (frontend/ and desktop/ each
          # declare their own), so pin the version explicitly.
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装前端依赖
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
      - name: 同步引擎依赖（含 gateway extras）
        run: cd qilin && uv sync --extra gateway
      - name: 编译桌面主进程（tsc）
        run: pnpm --dir desktop run build
      - name: 打包 gateway（PyInstaller onedir）
        timeout-minutes: 60
        env:
          # macOS 预签：electron-builder 不递归签 extraResources 内的
          # Mach-O，由 spec 用 APPLE_SIGNING_IDENTITY 预签 gateway 内嵌
          # 二进制，否则公证会 HARDFAIL。
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: pnpm --dir desktop run build:gateway
      - name: 导出前端静态资源
        run: pnpm --dir desktop run build:frontend
      - name: 校验打包资源
        run: pnpm --dir desktop run verify:package-resources
      - name: 构建安装包（electron-builder）
        timeout-minutes: 60
        env:
          # 无签名 secrets 时绝不自动发现本机签名身份（mac runner 自带
          # 证书会触发意外签名并因缺失 Entitlements 失败）；CSC_LINK
          # 显式提供时仍正常走 p12 签名。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # .app 外壳签名（electron-builder 原生读取）：
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PWD }}
          # notarization（electron-builder v25 三者齐全时自动公证）：
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 诊断：确认签名/公证 secrets 是否真的传进了构建步骤（只打印
          # 长度/是否设置，绝不打印内容）。CSC_LINK 应为 4236 字符。
          echo "::debug::CSC_LINK length=${#CSC_LINK}"
          echo "::debug::CSC_KEY_PASSWORD set=$([[ -n "$CSC_KEY_PASSWORD" ]] && echo yes || echo no)"
          echo "::debug::APPLE_ID set=$([[ -n "$APPLE_ID" ]] && echo yes || echo no)"
          echo "::debug::APPLE_APP_SPECIFIC_PASSWORD set=$([[ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]] && echo yes || echo no)"
          echo "::debug::APPLE_TEAM_ID set=$([[ -n "$APPLE_TEAM_ID" ]] && echo yes || echo no)"
          pnpm --dir desktop exec electron-builder --publish never
      - name: 校验 macOS 签名与公证（防静默发布损坏包）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_BUNDLE="$(find desktop/release -maxdepth 3 -name 'KWorks.app' -type d | head -1)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::未找到 KWorks.app，无法校验签名"
            exit 1
          fi
          echo "=== 签名身份 ==="
          codesign -dv --verbose=4 "$APP_BUNDLE" 2>&1 | grep -E "Signature|TeamIdentifier|Authority" || true
          # 1) 必须是 Developer ID 签名（拒绝 adhoc / 无 TeamIdentifier 的坏包）
          if codesign -dv --verbose=4 "$APP_BUNDLE" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::产物是 adhoc 签名 —— CSC_LINK/MAC_CERTIFICATE secrets 未生效，请检查 GitHub Secrets"
            exit 1
          fi
          if codesign -dv --verbose=4 "$APP_BUNDLE" 2>&1 | grep -q "TeamIdentifier=not set"; then
            echo "::error::产物无 TeamIdentifier —— 证书未生效，请检查 MAC_CERTIFICATE 是否为 Developer ID Application 类型"
            exit 1
          fi
          # 2) 必须通过 Gatekeeper 评估
          echo "=== Gatekeeper 评估 ==="
          spctl -a -vv "$APP_BUNDLE" 2>&1 | tail -3
          # 3) 必须带公证票据（notarization ticket stapled）
          echo "=== 公证票据 ==="
          xcrun stapler validate "$APP_BUNDLE" 2>&1 || {
            echo "::error::产物未公证（无 stapled ticket）—— APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID secrets 未生效"
            exit 1
          }
          echo "✅ macOS 产物签名与公证校验通过"
      - name: 收集安装包
        run: |
          mkdir -p dist-release
          # electron-builder 产物在 desktop/release/
          # 按扩展名收集所有安装包 + updater 元数据，不依赖文件名前缀。
          # blockmap 是 electron-updater 增量更新的元数据，必须随包分发。
          find desktop/release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.blockmap' -o -name 'latest*.yml' \) \
            -exec cp {} dist-release/ \;
          ls -lh dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: kworks-${{ matrix.os }}
          path: dist-release/**
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: 列出安装包
        run: ls -lh dist-release
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/**
          generate_release_notes: true
